name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: >-
          python -m unittest -v
          tests.test_ast
          tests.test_ddmin
          tests.test_integration
          tests.test_metrics
          tests.test_modules
          tests.test_oracle

  pytorch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: >-
          python -m unittest -v
          tests.test_compile_reduction
          tests.test_gradient
          tests.test_gradient_reduction
          tests.test_numerical
          tests.test_pytorch
