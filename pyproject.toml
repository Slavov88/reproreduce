[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reproreduce"
version = "0.1.0.dev0"
description = "Framework-aware delta debugging for failing Python and PyTorch programs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ReproReduce contributors" }]
dependencies = []

[project.scripts]
reproreduce = "reproreduce.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
